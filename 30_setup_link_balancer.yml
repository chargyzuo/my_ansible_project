---
- name: 自动化部署 FireHOL Link-Balancer
  hosts: spokes 
  become: yes
  
  tasks:
    - name: 更新 apt 缓存并安装基础依赖网络工具
      ansible.builtin.apt:
        name:
          - firehol      # 包含 link-balancer 工具
          - firehol-tools 
          - iproute2     # 提供 ip 命令
          - dnsutils     # 提供 dig 命令 (用于 check dig)
          - iputils-ping # 提供 ping 命令 (用于 check ping)
        state: present
        update_cache: yes

    - name: 确保网关配置目录存在 (/etc/gw)
      ansible.builtin.file:
        path: /etc/gw
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: 确保 FireHOL 配置目录存在 (/etc/firehol)
      ansible.builtin.file:
        path: /etc/firehol
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: 下发网关基础信息文件 (gw.info)
      ansible.builtin.template:
        src: templates/gw.info.j2
        dest: /etc/gw/gw.info
        owner: root
        group: root
        mode: '0644'
      

    - name: 下发路由策略文件 (lb.nets)
      ansible.builtin.template:
        src: templates/lb.nets.j2
        dest: /etc/gw/lb.nets
        owner: root
        group: root
        mode: '0644'
      

    - name: 下发 Link-Balancer 主配置文件 (link-balancer.conf)
      ansible.builtin.template:
        src: templates/link-balancer.conf.j2
        dest: /etc/firehol/link-balancer.conf
        owner: root
        group: root
        mode: '0644'

    
        
    - name: 确保 iproute2 配置目录存在 (/etc/iproute2)
      ansible.builtin.file:
        path: /etc/iproute2
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: 自动配置 iproute2 路由表名称与 ID 映射
      ansible.builtin.lineinfile:
        path: /etc/iproute2/rt_tables
        line: "{{ item.id }}\t{{ item.name }}"
        state: present
        create: yes  # 如果 rt_tables 文件不存在，则自动创建它
      loop:
        - { id: 200, name: 'bird' }
        - { id: 201, name: 'ISP1' }
        - { id: 202, name: 'ISP2' }
        - { id: 203, name: 'LB' }

    # ------------------------------------------------------------------
    # 关闭 firehol 自带防火墙。
    # 说明：我们安装 firehol 仅为获取 link-balancer 多 WAN 策略路由工具，
    # 并不需要它附带的默认防火墙服务。该服务默认自启，且默认策略为
    # policy DROP + 仅放行 ESTABLISHED，会丢弃所有 NEW 入站流量
    # （SSH、ICMP echo request 等），导致 GW 从管理网侧不可达。
    # 且 firehol 写在 iptables-legacy 后端，`nft list ruleset` 看不到。
    # 防火墙职责统一由 20_setup_nftables.yml 部署的 nftables 承担。
    # ------------------------------------------------------------------
    - name: 禁止 firehol 防火墙服务开机自启 (START_FIREHOL=NO)
      ansible.builtin.lineinfile:
        path: /etc/default/firehol
        regexp: '^\s*START_FIREHOL\s*='
        line: 'START_FIREHOL=NO'
        state: present
        create: yes
        owner: root
        group: root
        mode: '0644'

    - name: 停止并禁用 firehol 防火墙服务
      ansible.builtin.systemd:
        name: firehol
        state: stopped
        enabled: no
      failed_when: false   # 服务可能未注册/不存在，忽略以保证幂等
