---
- name: 控制端自举 —— 安装 Ansible 依赖(paramiko + collection)
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: 安装 paramiko(最新 3.x —— 与最新 netcommon 8.x 配套，支持 IOL 传输)
      ansible.builtin.pip:
        name: paramiko
        state: latest
        extra_args: --user

    - name: 按 requirements.yml 安装 collection(最新版)
      ansible.builtin.command:
        cmd: ansible-galaxy collection install -r requirements.yml --force
      register: galaxy
      changed_when: "'Installing' in galaxy.stdout or 'Downloading' in galaxy.stdout"