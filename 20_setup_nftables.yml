---
- name: 安装并配置 nftables 网关防火墙
  hosts: spokes
  tasks:
  pre_tasks:
    - name: 替换为 Debian buster 归档源
      copy:
        dest: /etc/apt/sources.list
        content: |
          deb http://archive.debian.org/debian buster main contrib non-free
          deb http://archive.debian.org/debian-security buster/updates main contrib non-free
        owner: root
        group: root
        mode: '0644'

    - name: 关闭 archive 源的时间有效性校验
      copy:
        dest: /etc/apt/apt.conf.d/99no-check-valid-until
        content: 'Acquire::Check-Valid-Until "false";'
        mode: '0644'

    - name: 刷新 apt 缓存(忽略归档源过期告警)
      apt:
        update_cache: yes


    - name: 安装 nftables
      apt:
        name: nftables
        state: present
        update_cache: yes

    - name: 开启内核 IPv4 转发 (路由功能必备)
      sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        reload: yes

    - name: 下发 nftables.conf 配置
      template:
        src: nftables.conf.j2
        dest: /etc/nftables.conf
        mode: '0750'

    - name: 启用并重启 nftables 服务
      service:
        name: nftables
        state: restarted
        enabled: yes
