# GW11 = hub1，接入 ISP1
mac_address: "00:50:00:00:05:00"

# eth2 = ISP1(WAN)  eth4 = LAN(到 CSW 的 /30 互联段,无 VIP)  (eth0=OOB dhcp 见模板)
interfaces:
  eth2: "59.3.3.2/30"
  eth4: "10.211.9.1/30"

# 本 hub 的 LAN 聚合网段与核心交换机下一跳(每 hub 独立)
GW_NET_10: "10.211.0.0/16"
GW_CSW_IP: "10.211.9.2"

tunnel_self_IP: "172.20.0.1/24"

# 本 hub 只承载 ct(ISP1)隧道,WG/BIRD 模板据此只对接各 spoke 的 ct 隧道
hub_tunnel_kind: "ct"
