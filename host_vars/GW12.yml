# GW12 = hub2，接入 ISP2
mac_address: "00:50:00:00:06:00"

# eth2 = ISP2(WAN)  eth4 = LAN(到 CSW 的 /30 互联段,无 VIP)  (eth0=OOB dhcp 见模板)
interfaces:
  eth2: "212.3.3.2/30"
  eth4: "10.212.9.1/30"

# 本 hub 的 LAN 聚合网段与核心交换机下一跳(每 hub 独立)
GW_NET_10: "10.212.0.0/16"
GW_CSW_IP: "10.212.9.2"

tunnel_self_IP: "172.21.0.1/24"

# 本 hub 只承载 cu(ISP2)隧道,WG/BIRD 模板据此只对接各 spoke 的 cu 隧道
hub_tunnel_kind: "cu"
