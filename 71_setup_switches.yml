---
- name: IOS 交换机基础配置
  hosts: switches
  gather_facts: no          # network play 必须关(设备上没 Python)
  # 不写 connection,继承 group_vars/ios.yml 的 network_cli
  tasks:

    # ---- 5.1 hostname ----
    - name: 配置 hostname
      cisco.ios.ios_hostname:
        config:
          hostname: "{{ hostname }}"
        state: merged

    # ---- 5.2 VLAN(必须先建,后面 access_vlan / SVI 才有依赖)----
    - name: 配置 VLAN
      cisco.ios.ios_vlans:
        config: "{{ vlans }}"      # 直接把 host_vars 的 list 喂进去
        state: merged

    # ---- 5.3 SVI / 三层口(仅当设备定义了 svis 时才跑)----
    - name: 配置 SVI (三层接口 IP)
      cisco.ios.ios_l3_interfaces:
        config: "{{ svis }}"
        state: merged
      when: svis is defined        # HubSW 是纯二层,没定义 svis 就跳过

    # ---- 5.4 二层口 access / trunk ----
    - name: 配置二层接口
      cisco.ios.ios_l2_interfaces:
        config: "{{ l2_ports }}"      # host_vars 需用模块原生结构,见 5.6
        state: merged
      when: l2_ports is defined

    # ---- 5.5 接口 no shutdown + 描述 ----
    - name: 打开接口并写描述
      cisco.ios.ios_interfaces:
        config: "{{ interfaces_cfg }}"
        state: merged
      when: interfaces_cfg is defined

    - name: 保存 running-config 到 startup-config
      cisco.ios.ios_config:
        save_when: modified